<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hezarfen: Galata'dan Üsküdar'a</title>
  
  <!-- Google Fonts: Schoolbell -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css?v=204">

  <!-- Three.js Module Import -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="overlay">
    <div class="menu-container">
      <div id="briefing-panel">
        <div class="hero-tag">1632 • İSTANBUL</div>
        <p class="hero-desc">Galata Kulesi ➔ Üsküdar Doğancılar (3.300 m)</p>
        <div class="menu-actions">
          <a href="game.html?mode=camera" class="btn-start btn-hero">🦅 HEZARFEN GİBİ UÇ (KAMERA İLE)</a>
          <a href="game.html?mode=keyboard" class="btn-secondary">⌨️ KLAVYE İLE UÇ (SPACE)</a>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initFlyingBird3D } from './js/components/flying-bird-3d.js?v=230';

    // Standalone 3D Flying Hezarfen & Glowing Path Component
    initFlyingBird3D({
      container: document.getElementById('overlay'),
      pathColor: '#a855f7',
      speed: 1.0,
      modelUrl: './scenes/hezarfen_opt.glb'
    });

    // Quick launch to keyboard flight on Space or Enter key
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        window.location.href = 'game.html?mode=keyboard';
      }
    });
  </script>
</body>
</html>
